<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factorial Calculator</title>
  </head>
  <body style="font-family: Arial; text-align: center; margin-top: 50px">
    <h1 style="color: #333">Factorial Calculator</h1>
    <button
      onclick="calculateFactorial()"
      style="
        padding: 10px 20px;
        font-size: 16px;
        background: #007aff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      "
    >
      Calculate Factorial
    </button>
    <div
      id="result"
      style="margin-top: 20px; font-size: 18px; font-weight: bold"
    ></div>

    <script>
      function calculateFactorial() {
        const input = prompt("Enter a number to find its factorial:");

        if (input === null || input === "") {
          document.getElementById("result").innerHTML = "No number entered.";
          return;
        }

        const number = parseInt(input);

        if (isNaN(number)) {
          document.getElementById("result").innerHTML =
            "Please enter a valid number.";
          return;
        }

        if (number < 0) {
          document.getElementById("result").innerHTML =
            "Factorial is not defined for negative numbers.";
          return;
        }

        const factorial = findFactorial(number);

        document.getElementById(
          "result"
        ).innerHTML = `Factorial of ${number} is: ${factorial}`;
      }

      function findFactorial(n) {
        if (n === 0 || n === 1) {
          return 1;
        }

        let result = 1;
        for (let i = 2; i <= n; i++) {
          result *= i;
        }
        return result;
      }
    </script>
  </body>
</html>
