<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - BookHaven</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <a href="index.html" class="logo">📚 BookHaven</a>
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="catalogue.html">Books</a></li>
            <li><a href="login.html">Login</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="welcome-section">
          <h2>Login to BookHaven</h2>
          <p>
            Access your account to browse, purchase, and manage your book
            collection.
          </p>

          <form style="max-width: 400px; margin: 2rem auto 0">
            <div class="form-group">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
              />
            </div>

            <button type="submit" class="btn" style="width: 100%">Login</button>
          </form>

          <p style="margin-top: 2rem; color: #666">
            Don't have an account?
            <a href="#" style="color: #3498db; text-decoration: none"
              >Sign up here</a
            >
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
